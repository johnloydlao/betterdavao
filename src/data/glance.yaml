# "Davao at a glance" figures on the home page.
#
# Every figure needs a source, listed below and in docs/data-sources.md.
# Sources are not shown on the home page. Set `verified: false` when the
# only source is secondary (not PSA or the City Government): the figure is
# then hidden until an official source confirms it.

sources:
