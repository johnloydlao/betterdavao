# Agriculture & Fisheries Category Pages
# This file contains all the pages/services available under the Agriculture & Fisheries category

pages:
  - name: 'Ask for free seeds, seedlings, fertilizers, or fingerlings'
    slug: 'ask-for-free-seeds-seedlings-fertilizers-or-fingerlings'
    description: "How to request free seeds, seedlings, fingerlings and biological control agents from the City Agriculturist's Office. The charter lists no general fertilizer service."

  - name: 'Get veterinary services for livestock'
    slug: 'get-veterinary-services-for-livestock'
    description: "Livestock dispersal, artificial insemination, anti-rabies vaccination, neutering and impounding from the City Veterinarian's Office."

  - name: 'Attend farming or fishing training'
    slug: 'attend-farming-or-fishing-training'
    description: "City Agriculturist's Office trainings, free technical assistance, and fishing licenses, boat registration and other fisheries permits."

  - name: 'Borrow farm tools or equipment from the LGU'
    slug: 'borrow-farm-tools-or-equipment-from-the-lgu'
    description: "Small irrigation pump lending, machinery and equipment support, and rainwater catchment projects for registered farmers' organizations, farmers and fisherfolk."
